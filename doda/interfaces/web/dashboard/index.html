<meta charset="utf-8" />
<title>DODA — AI Agent OS · Control Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  /* ============================================================
     DODA — AI Agent OS · Control Center (multi-page SPA)
     Self-contained (no external fonts/scripts — CSP-safe).
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --bg-0: #080b14; --bg-1: #0b1020;
    --panel: rgba(18, 25, 43, 0.66); --panel-solid: #10182b; --panel-2: rgba(24, 33, 56, 0.55);
    --border: rgba(139, 152, 190, 0.12); --border-strong: rgba(139, 152, 190, 0.22);
    --shadow: 0 18px 48px -24px rgba(0, 0, 0, 0.85);
    --text: #e8ebf5; --text-dim: #9aa3bd; --text-mute: #6b7492;
    --purple: #a78bfa; --blue: #5b9dff; --cyan: #22d3ee; --green: #34d399;
    --amber: #fbbf24; --orange: #fb923c; --red: #f87171; --pink: #f472b6;
    --ok: var(--green); --pending: var(--amber); --error: var(--red); --idle: #64748b;
    --grad-brand: linear-gradient(135deg, #7c5cff 0%, #4b8dff 100%);
    --grad-soft: linear-gradient(135deg, rgba(124, 92, 255, 0.16), rgba(75, 141, 255, 0.10));
    --radius: 18px; --radius-sm: 12px; --sidebar-w: 244px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg-0: #edf0f7; --bg-1: #e4e9f4; --panel: rgba(255,255,255,0.72); --panel-solid: #ffffff;
    --panel-2: rgba(255,255,255,0.6); --border: rgba(20,30,60,0.10); --border-strong: rgba(20,30,60,0.18);
    --shadow: 0 18px 44px -26px rgba(30,45,90,0.35); --text: #16203a; --text-dim: #4b566f;
    --text-mute: #7a839c; --idle: #94a3b8;
  }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1200px 620px at 78% -8%, rgba(124,92,255,0.12), transparent 60%),
      radial-gradient(1000px 560px at 8% 108%, rgba(34,211,238,0.08), transparent 55%),
      var(--bg-0);
    color: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; } button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: rgba(124,92,255,0.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(139,152,190,0.18); border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(139,152,190,0.32); background-clip: content-box; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column;
    padding: 20px 14px; gap: 6px; border-right: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(13,18,34,0.9), rgba(8,11,20,0.72)); backdrop-filter: blur(14px); z-index: 40; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 18px; }
  .brand .logo { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: var(--grad-brand); box-shadow: 0 8px 24px -8px rgba(124,92,255,0.7), inset 0 0 0 1px rgba(255,255,255,0.12); color: #fff; flex: none; }
  .brand .logo svg { width: 24px; height: 24px; }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: 0.2px; line-height: 1.05; }
  .brand-sub { font-size: 11px; color: var(--text-mute); letter-spacing: 0.6px; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; margin: 0 -2px; padding: 0 2px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 11px; color: var(--text-dim);
    font-size: 13.5px; font-weight: 500; border: 1px solid transparent; position: relative;
    transition: background .18s, color .18s, border-color .18s; background: transparent; width: 100%; text-align: left; }
  .nav-item svg { width: 18px; height: 18px; flex: none; opacity: .9; }
  .nav-item:hover { color: var(--text); background: rgba(139,152,190,0.07); }
  .nav-item.active { color: #fff; background: var(--grad-soft); border-color: rgba(124,92,255,0.32); }
  .nav-item.active::before { content: ""; position: absolute; left: -2px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 4px; background: var(--grad-brand); box-shadow: 0 0 12px rgba(124,92,255,0.8); }
  .profile { margin-top: 8px; display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 13px;
    border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; transition: border-color .2s; }
  .profile:hover { border-color: var(--border-strong); }
  .avatar { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#22d3ee,#5b9dff);
    display: grid; place-items: center; color: #06111f; font-weight: 700; font-size: 14px; flex: none; }
  .profile .who { font-size: 13px; font-weight: 600; line-height: 1.15; }
  .profile .stat { font-size: 11px; color: var(--text-mute); display: flex; align-items: center; gap: 5px; }
  .profile .stat i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .content { padding: 20px 26px 132px; }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px; padding: 16px 26px;
    background: linear-gradient(180deg, rgba(8,11,20,0.86), rgba(8,11,20,0.5)); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .hello h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
  .hello p { margin: 2px 0 0; font-size: 13px; color: var(--text-dim); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .search { display: flex; align-items: center; gap: 9px; padding: 9px 12px; width: 260px; max-width: 34vw; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text-mute); font-size: 13px; transition: border-color .2s, box-shadow .2s; }
  .search:focus-within { border-color: rgba(124,92,255,0.5); box-shadow: 0 0 0 3px rgba(124,92,255,0.12); }
  .search input { border: 0; background: transparent; outline: 0; color: var(--text); flex: 1; font-size: 13px; }
  .search input::placeholder { color: var(--text-mute); }
  .kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border-strong); color: var(--text-mute); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); position: relative; transition: color .18s, border-color .18s, background .18s; }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .dot { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px var(--bg-0); }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 0 15px; height: 40px; border-radius: 12px; border: 0;
    background: var(--grad-brand); color: #fff; font-weight: 600; font-size: 13px; box-shadow: 0 10px 26px -10px rgba(124,92,255,0.75); transition: transform .12s, filter .2s; }
  .btn-primary:hover { filter: brightness(1.08); } .btn-primary:active { transform: translateY(1px); } .btn-primary svg { width: 17px; height: 17px; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); font-size: 13px; font-weight: 550; transition: color .18s, border-color .18s; }
  .btn-ghost:hover { color: var(--text); border-color: var(--purple); } .btn-ghost svg { width: 15px; height: 15px; }
  .hamburger { display: none; }

  /* Cards */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    backdrop-filter: blur(16px); padding: 18px; position: relative; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-head .ttl { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 650; }
  .card-head .ttl svg { width: 17px; height: 17px; color: var(--text-dim); }
  .card-head .aside { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .card-link { font-size: 12.5px; color: var(--blue); font-weight: 550; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; }
  .card-link:hover { color: var(--cyan); } .card-link svg { width: 14px; height: 14px; }

  .badge-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; letter-spacing: .2px; }
  .badge-status .pip { width: 7px; height: 7px; border-radius: 50%; }
  .st-live { color: var(--green); background: rgba(52,211,153,0.12); } .st-live .pip { background: var(--green); animation: pulse 2s infinite; }
  .st-active { color: var(--green); background: rgba(52,211,153,0.12); } .st-active .pip { background: var(--green); }
  .st-idle { color: var(--text-mute); background: rgba(100,116,139,0.14); } .st-idle .pip { background: var(--idle); }
  .st-pending { color: var(--amber); background: rgba(251,191,36,0.12); } .st-pending .pip { background: var(--amber); }
  .st-error { color: var(--red); background: rgba(248,113,113,0.14); } .st-error .pip { background: var(--red); animation: pulse-red 1.4s infinite; }
  .st-done { color: var(--blue); background: rgba(91,157,255,0.12); } .st-done .pip { background: var(--blue); }

  /* page header */
  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
  .page-head .ph-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--grad-soft); border: 1px solid rgba(124,92,255,0.3); color: var(--purple); }
  .page-head .ph-ic svg { width: 22px; height: 22px; }
  .page-head h2 { margin: 0; font-size: 22px; font-weight: 720; letter-spacing: -0.4px; }
  .page-head p { margin: 3px 0 0; font-size: 13px; color: var(--text-dim); }
  .page-head .ph-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  /* grids */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .grid-main { display: grid; grid-template-columns: 340px minmax(0,1fr) 340px; gap: 16px; align-items: stretch; margin-top: 18px; }
  .grid-main > .card { display: flex; flex-direction: column; }
  .grid-sec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .col-2 { grid-column: span 2; }
  .mt { margin-top: 16px; }
  .sec-h { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-mute); font-weight: 600; padding: 4px 2px 0; margin-top: 18px; }

  .stat-card { padding: 16px; } .stat-card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .stat-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; } .stat-ic svg { width: 17px; height: 17px; }
  .stat-card .lbl { font-size: 12px; color: var(--text-dim); font-weight: 550; }
  .stat-card .val { font-size: 21px; font-weight: 720; letter-spacing: -0.4px; line-height: 1.1; } .stat-card .val small { font-size: 12px; color: var(--text-mute); font-weight: 500; }
  .stat-card .sub { font-size: 11.5px; color: var(--text-mute); margin-top: 3px; }
  .bar { height: 6px; border-radius: 20px; background: rgba(139,152,190,0.14); overflow: hidden; margin-top: 11px; }
  .bar > span { display: block; height: 100%; border-radius: 20px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .tint-purple { background: rgba(167,139,250,0.14); color: var(--purple); } .tint-blue { background: rgba(91,157,255,0.14); color: var(--blue); }
  .tint-cyan { background: rgba(34,211,238,0.14); color: var(--cyan); } .tint-green { background: rgba(52,211,153,0.14); color: var(--green); }
  .tint-orange { background: rgba(251,146,60,0.14); color: var(--orange); } .tint-pink { background: rgba(244,114,182,0.14); color: var(--pink); }
  .tint-red { background: rgba(248,113,113,0.14); color: var(--red); }
  .fill-purple { background: linear-gradient(90deg,#7c5cff,#a78bfa); } .fill-blue { background: linear-gradient(90deg,#3b82f6,#5b9dff); }
  .fill-cyan { background: linear-gradient(90deg,#0891b2,#22d3ee); } .fill-green { background: linear-gradient(90deg,#059669,#34d399); }
  .fill-orange { background: linear-gradient(90deg,#ea580c,#fb923c); } .fill-pink { background: linear-gradient(90deg,#db2777,#f472b6); }

  /* thinking log / timeline */
  .timeline { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; max-height: 430px; padding-right: 4px; }
  .tl-item { display: grid; grid-template-columns: 20px 1fr; gap: 12px; padding: 7px 0; }
  .tl-rail { display: flex; flex-direction: column; align-items: center; }
  .tl-node { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--panel-solid); border: 1px solid var(--border-strong); }
  .tl-node svg { width: 11px; height: 11px; }
  .tl-line { width: 2px; flex: 1; background: linear-gradient(var(--border-strong), transparent); margin-top: 2px; min-height: 8px; }
  .tl-item:last-child .tl-line { display: none; }
  .tl-time { font-family: var(--mono); font-size: 11px; color: var(--text-mute); }
  .tl-msg { font-size: 13px; color: var(--text); margin-top: 1px; line-height: 1.35; }
  .tl-tag { display: inline-block; margin-top: 4px; font-size: 11px; padding: 1px 8px; border-radius: 20px; background: rgba(91,157,255,0.12); color: var(--blue); font-family: var(--mono); }
  .tl-enter { animation: slideIn .4s cubic-bezier(.2,.8,.2,1); }

  /* brain */
  .brain-wrap { position: relative; flex: 1; min-height: 430px; border-radius: var(--radius-sm); overflow: hidden;
    background: radial-gradient(closest-side at 50% 46%, rgba(124,92,255,0.09), transparent 72%); }
  .brain-wrap.tall { min-height: 560px; }
  canvas.brain { display: block; width: 100%; height: 100%; cursor: pointer; }
  .brain-tip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -12px); background: var(--panel-solid);
    border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; font-size: 12px; min-width: 148px; box-shadow: var(--shadow); transition: opacity .16s; z-index: 5; }
  .brain-tip.show { opacity: 1; }
  .brain-tip .bt-name { font-weight: 650; display: flex; align-items: center; gap: 7px; margin-bottom: 6px; text-transform: capitalize; }
  .brain-tip .bt-name svg { width: 14px; height: 14px; }
  .brain-tip .bt-row { display: flex; justify-content: space-between; gap: 14px; font-size: 11.5px; color: var(--text-dim); padding: 2px 0; }
  .brain-tip .bt-row b { color: var(--text); font-weight: 600; }
  .brain-legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 12px; font-size: 11.5px; color: var(--text-dim); }
  .brain-legend span { display: inline-flex; align-items: center; gap: 6px; } .brain-legend i { width: 8px; height: 8px; border-radius: 50%; }

  /* performance / spark */
  .perf-item { padding: 12px 0; border-bottom: 1px solid var(--border); } .perf-item:last-child { border-bottom: 0; }
  .perf-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .perf-top .p-ic { color: var(--text-dim); display: grid; place-items: center; } .perf-top .p-ic svg { width: 15px; height: 15px; }
  .perf-top .p-name { font-size: 12.5px; color: var(--text-dim); font-weight: 550; }
  .perf-top .p-val { margin-left: auto; font-family: var(--mono); font-size: 13px; font-weight: 600; } .perf-top .p-val small { color: var(--text-mute); font-weight: 500; }
  .spark { width: 100%; height: 40px; display: block; }

  /* rows / lists */
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); } .row:last-child { border-bottom: 0; }
  .row .r-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; } .row .r-ic svg { width: 16px; height: 16px; }
  .row .r-main { min-width: 0; flex: 1; }
  .row .r-title { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r-sub { font-size: 11.5px; color: var(--text-mute); margin-top: 1px; }
  .row .r-time { font-family: var(--mono); font-size: 11px; color: var(--text-mute); white-space: nowrap; }
  .row .r-dur { font-family: var(--mono); font-size: 11.5px; color: var(--cyan); white-space: nowrap; }

  .sched-item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); } .sched-item:last-child { border-bottom: 0; }
  .sched-time { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); width: 46px; } .sched-name { font-size: 13px; flex: 1; }

  .cost-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .cost-cell .k { font-size: 11.5px; color: var(--text-mute); } .cost-cell .v { font-size: 16px; font-weight: 680; margin-top: 2px; } .cost-cell .v small { font-size: 11.5px; color: var(--text-mute); font-weight: 500; }
  .cost-bars { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-top: 6px; } .cost-bars i { flex: 1; border-radius: 3px 3px 0 0; background: linear-gradient(180deg,#5b9dff,rgba(91,157,255,0.25)); min-height: 4px; }

  .mem-wrap { display: flex; align-items: center; gap: 16px; } .mem-canvas-wrap { position: relative; width: 128px; height: 128px; flex: none; }
  canvas.donut { width: 128px; height: 128px; } .mem-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .mem-center .mv { font-size: 19px; font-weight: 720; } .mem-center .ml { font-size: 10.5px; color: var(--text-mute); }
  .mem-legend { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .mem-legend .lg { display: flex; align-items: center; gap: 8px; font-size: 12px; } .mem-legend .lg i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .mem-legend .lg .lg-n { color: var(--text-dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mem-legend .lg .lg-v { font-family: var(--mono); font-size: 11.5px; color: var(--text); }

  .vv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .vv-block .vv-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 10px; } .vv-block .vv-head svg { width: 16px; height: 16px; color: var(--text-dim); }
  .vv-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); padding: 4px 0; } .vv-line .vv-k { color: var(--text-mute); } .vv-line .vv-v { margin-left: auto; color: var(--text); font-weight: 550; }
  .cam-preview { margin-top: 8px; height: 96px; border-radius: 12px; border: 1px solid var(--border);
    background: repeating-linear-gradient(0deg, rgba(34,211,238,0.05) 0 2px, transparent 2px 4px), radial-gradient(120px 60px at 50% 40%, rgba(34,211,238,0.14), transparent), #0a1220;
    position: relative; overflow: hidden; display: grid; place-items: center; }
  .cam-preview.big { height: 260px; }
  .cam-preview .rec { position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-family: var(--mono); color: var(--red); } .cam-preview .rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse-red 1.4s infinite; }
  .cam-preview svg { width: 28px; height: 28px; color: rgba(34,211,238,0.55); }
  .cam-scan { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg,transparent,rgba(34,211,238,0.7),transparent); animation: scan 3.2s linear infinite; }

  /* chat */
  .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 250px); min-height: 420px; }
  .chat-thread { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 6px 4px 12px; }
  .msg { display: flex; gap: 11px; max-width: 76%; animation: slideIn .3s ease; }
  .msg .m-ava { width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center; }

  function Sparkline(canvas,color){
    const ctx=canvas.getContext("2d"); const data=new Array(48).fill(0); let w=0,h=0,d=Math.min(devicePixelRatio||1,2);
    function size(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);}
    function draw(){ ctx.clearRect(0,0,w,h); const max=100,pad=3; ctx.strokeStyle="rgba(139,152,190,0.08)";ctx.lineWidth=1;
      for(let i=1;i<3;i++){const y=(h/3)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
      const step=w/(data.length-1), pt=(v,i)=>[i*step,h-pad-(v/max)*(h-pad*2)];
      ctx.beginPath();ctx.moveTo(0,h);data.forEach((v,i)=>{const[x,y]=pt(v,i);ctx.lineTo(x,y);});ctx.lineTo(w,h);ctx.closePath();
      const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,hexA(color,.28));g.addColorStop(1,hexA(color,0));ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();data.forEach((v,i)=>{const[x,y]=pt(v,i);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.lineJoin="round";ctx.stroke();

    }
    size();draw();
    return { push(v){data.push(v);data.shift();draw();}, resize(){size();draw();} };
  }

  }

    function draw(t){ ctx.clearRect(0,0,bw,bh); const cx=bw/2,cy=bh/2; const pulse=reduce?.6:(.5+.5*Math.sin(t/900)); const coreR=Math.min(bw,bh)*0.13;

      ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="700 14px "+getComputedStyle(document.body).fontFamily;ctx.fillText("DODA",cx,cy-6);ctx.font="500 9.5px "+getComputedStyle(document.body).fontFamily;ctx.fillStyle="rgba(255,255,255,0.8)";ctx.fillText("AI Agent",cx,cy+9);

  function cmdSubmit(){ const v=$("#cmdInput").value.trim(); if(!v)return; $("#cmdInput").value="";
    if(navBtns.Chat.classList.contains("active")&&window.__chatSend){window.__chatSend(v);}
    else { chatLog.push({who:"user",text:v,time:now()}); go("Chat"); setTimeout(()=>{ if(window.__chatSend){/* re-render already shows */} },0);
      const live=source.send({type:"chat",text:v}); if(!live){setTimeout(()=>{chatLog.push({who:"bot",text:mockReply(v),time:now()});go("Chat");},700);} }
  }
  $("#cmdSend").onclick=cmdSubmit; $("#cmdInput").addEventListener("keydown",(e)=>{if(e.key==="Enter")cmdSubmit();});
  $("#micBtn").onclick=()=>{go("Voice"); setTimeout(()=>{ if(window.__startVoice)window.__startVoice(); },250);}; $("#attachBtn").onclick=()=>toast("📎 Fayl biriktirish");
  $("#newTaskBtn").onclick=()=>go("Tasks & Goals");
  $("#notifBtn").onclick=()=>toast("🔔 3 ta yangi bildirishnoma");
  $("#profileBtn").onclick=()=>go("Settings");
  window.addEventListener("keydown",(e)=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();const s=$("#globalSearch");if(s)s.focus();}});
  $("#globalSearch").addEventListener("keydown",(e)=>{if(e.key==="Enter"){const q=e.target.value.trim();if(q){go("Memory");toast('Qidirilyapti: "'+q+'"');}}});

  /* ===================== BOOT ===================== */
  source.start();
  go("Dashboard");
})();
</script>
