const YEAR = new Date().getFullYear();
function applyLang(lang){
  if(!I18N[lang]) lang = "uz";
  const d = I18N[lang];
  document.documentElement.lang = lang;
  document.title = d.meta_title;
  const md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute("content", d.meta_desc);
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const v = d[el.getAttribute("data-i18n")];
    if(v != null) el.innerHTML = v.replace("{year}", YEAR);
  });
  document.querySelectorAll(".lang-switch button").forEach(function(b){
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  try{ localStorage.setItem("doda_lang", lang); }catch(e){}
}
(function(){
  let saved = null;
  try{ saved = localStorage.getItem("doda_lang"); }catch(e){}
  applyLang(saved || "uz");
  document.querySelectorAll(".lang-switch button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.dataset.lang); });
  });
})();

/* ==================== Hero foni: neyron tarmoq animatsiyasi (o'zgarmagan) ==================== */
(function(){
  const c = document.getElementById('net'), x = c.getContext('2d');
  let W, H, pts, DPR = Math.min(devicePixelRatio||1, 1.5);
  function resize(){
    const r = c.getBoundingClientRect();
    W = c.width = r.width*DPR; H = c.height = r.height*DPR;
    const n = Math.min(72, Math.floor(r.width/16));
    pts = Array.from({length:n}, ()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.28*DPR, vy:(Math.random()-.5)*.28*DPR
    }));
  }
  function tick(){
    x.clearRect(0,0,W,H);
    for(const p of pts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
    }
    const R = 130*DPR;
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const a=pts[i], b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if(d<R){
          x.strokeStyle='rgba(47,214,189,'+(0.16*(1-d/R))+')';
          x.lineWidth=DPR; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke();
        }
      }
    }
    for(const p of pts){
      x.fillStyle='rgba(95,240,218,.75)';
      x.beginPath(); x.arc(p.x,p.y,1.7*DPR,0,7); x.fill();
    }
    requestAnimationFrame(tick);
  }
  addEventListener('resize', resize); resize(); tick();
})();
</script>
